<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Gestão Nails</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">

    <div class="gold-decor decor-1"></div>
    <div class="gold-decor decor-2"></div>
    <div class="gold-decor decor-3"></div>
    <div class="gold-decor decor-4"></div>
    <div class="gold-decor decor-5"></div>
    <div class="gold-decor decor-6"></div>
    <div class="gold-decor decor-7"></div>

    <div class="gold-dot dot-1"></div>
    <div class="gold-dot dot-2"></div>
    <div class="gold-dot dot-3"></div>
    <div class="gold-dot dot-4"></div>
    <div class="gold-dot dot-5"></div>
    <div class="gold-dot dot-6"></div>

    <div class="login-container">
        <p class="tagline">Inspire-se. Inove-se. Mostre seu Trabalho.</p>

        <div class="card">
            <h1 class="card-title">Criar Conta</h1>

            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Escolha um usuário" autocomplete="off"/>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Escolha uma senha" autocomplete="new-password"/>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" id="confirmPassword" placeholder="Repita a senha" autocomplete="new-password"/>
            </div>

            <button class="btn-primary" id="registerBtn">Cadastrar</button>

            <a href="/login.html" class="forgot-link">Já tenho conta</a>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>

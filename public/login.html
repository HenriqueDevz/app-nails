<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestão Nails</title>
        <link rel="manifest" href="/manifest.json">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body class="login-page">
        <div class="gold-decor decor-1"></div>
        <div class="gold-decor decor-2"></div>
        <div class="gold-decor decor-3"></div>
        <div class="gold-decor decor-4"></div>
        <div class="gold-decor decor-5"></div>
        <div class="gold-decor decor-6"></div>
        <div class="gold-decor decor-7"></div>

        <div class="gold-dot dot-1"></div>
        <div class="gold-dot dot-2"></div>
        <div class="gold-dot dot-3"></div>
        <div class="gold-dot dot-4"></div>
        <div class="gold-dot dot-5"></div>
        <div class="gold-dot dot-6"></div>

        <div class="login-container">
            <p class="tagline">Inspire-se. Inove-se. Mostre seu Trabalho.</p>
            
            <div class="card">
                <h1 class="card-title">Bem-Vinda!</h1>
                
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Seu usuário" autocomplete="off"/>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" autocomplete="new-password" />
                </div>

                <button class="btn-primary" id="loginBtn">Entrar</button>

                <a href="#" class="forgot-link" id="registerBtn">Criar conta</a>
            </div>

        </div>
        <script src="/js/login.js"></script>
        <script>
            if('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js');
            }
        </script>
    </body>
</html>
